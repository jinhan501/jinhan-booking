  <script>/* Shared business rules. Keep this file browser- and Apps Script-compatible. */
var BookingCore = (function () {
  'use strict';
  var STATUS = { pending: '待確認成團', confirmed: '已成團', cancelled: '不成團' };
  function fail(message) { throw new Error(message); }
  function integer(value, min, max, label) {
    var n = Number(value);
    if (value === '' || !Number.isSafeInteger(n) || n < min || n > max) fail(label + '格式不正確');
    return n;
  }
  function dateKey(now) { return new Date(+new Date(now) + 8 * 3600000).toISOString().slice(0, 10); }
  function timing(s) {
    var day = +new Date(s.date + 'T00:00:00+08:00');
    var start = +new Date(s.date + 'T' + s.time + ':00+08:00');
    return { start: start, cutoff: day, notice: day - 12 * 3600000, checkin: start - 20 * 60000, hold: start - 5 * 60000, end: start + 30 * 60000 };
  }
  function counts(bookings) {
    return (bookings || []).reduce(function (a, b) {
      if (b.status === 'active') { a.people += Number(b.people); a.children += Number(b.children); a.orders++; a.amount += Number(b.amount); }
      return a;
    }, { people: 0, children: 0, orders: 0, amount: 0 });
  }
  function publicSession(s, bookings, now) {
    var c = counts(bookings), t = timing(s), n = +new Date(now);
    var remaining = Math.max(0, s.capacity - c.people);
    var closed = n >= t.cutoff;
    return { id: s.id, date: s.date, time: s.time, price: s.price, capacity: s.capacity,
      status: s.status, statusText: STATUS[s.status], noticeAt: t.notice, cutoffAt: t.cutoff,
      checkinAt: t.checkin, holdAt: t.hold, startAt: t.start, endAt: t.end,
      remaining: closed || s.deletedAt ? null : remaining, registrationOpen: !s.deletedAt && !closed && s.status !== 'cancelled' && remaining > 0,
      registrationText: s.deletedAt ? '已刪除' : s.status === 'cancelled' ? '本場不成團' : closed ? (n >= t.end ? '本場已結束' : '線上報名已截止') : remaining === 0 ? '本場已額滿' : '開放報名',
      dayOf: dateKey(now) === s.date, noticeOverdue: s.status === 'pending' && n >= t.notice };
  }
  function validateSession(input, now) {
    var date = String(input.date || ''), time = String(input.time || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) fail('請填寫有效的日期與時間');
    var s = { date: date, time: time, capacity: 40, price: 100 };
    if (dateKey(new Date(date + 'T12:00:00+08:00')) !== date) fail('日期不存在');
    if (timing(s).cutoff <= +new Date(now)) fail('請建立明天或之後的場次');
    return s;
  }
  function validateBooking(input) {
    var name = String(input.name || '').trim(), phone = String(input.phone || '').replace(/[\s-]/g, ''), email = String(input.email || '').trim().toLowerCase();
    if (name.length < 1 || name.length > 50) fail('請填寫聯絡人姓名（50 字以內）');
    if (!/^09\d{8}$/.test(phone)) fail('請填寫 09 開頭的 10 碼手機號碼');
    if (email.length > 254 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) fail('請填寫有效的 Email');
    var notes = String(input.notes || '').trim();
    if (notes.length > 500) fail('備註請勿超過 500 字');
    if (input.website) fail('無法送出預約，請重新整理');
    if (input.agree !== true) fail('請先閱讀並同意預約須知');
    return { name: name, phone: phone, email: email, people: integer(input.people, 1, 15, '報名人數'), children: integer(input.children, 0, 999, '隨行幼兒人數'), notes: notes };
  }
  function validateReschedule(input, now) {
    var clean=validateSession(input,new Date(+new Date(dateKey(now)+'T00:00:00+08:00')-1));
    if(timing(clean).start<=+new Date(now)) fail('請選擇尚未開始的日期與時間');
    return {date:clean.date,time:clean.time};
  }
  function assertAvailability(s, bookings, people, now, excludingId) {
    if(s.deletedAt) fail('此場次已刪除');
    if (s.status === 'cancelled') fail('本場次不成團，已停止報名');
    if (+new Date(now) >= timing(s).cutoff) fail('線上報名已截止，活動當天請洽現場人員');
    var used = counts(bookings.filter(function (b) { return b.id !== excludingId; })).people;
    if (used + people > s.capacity) fail('目前僅剩 ' + Math.max(0, s.capacity - used) + ' 個名額，請調整報名人數');
  }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function taipei(when, full) {
    var d = new Date(+new Date(when) + 8 * 3600000).toISOString();
    return (full ? d.slice(0, 10).replace(/-/g, '/') + ' ' : '') + d.slice(11, 16);
  }
  return { STATUS: STATUS, integer: integer, timing: timing, counts: counts, dateKey: dateKey,
    publicSession: publicSession, validateSession: validateSession, validateReschedule: validateReschedule, validateBooking: validateBooking,
    assertAvailability: assertAvailability, escapeHtml: escapeHtml, taipei: taipei };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = BookingCore;
</script>
  <script>(function(root){
  'use strict';
  async function call(serviceUrl,action,payload){
    if(action!=='public.list'&&action!=='public.book')throw Error('請從管理後台操作此功能');
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),60000);
    try{
      const options={method:action==='public.list'?'GET':'POST',mode:'cors',credentials:'omit',redirect:'follow',signal:controller.signal};
      let url=serviceUrl;
      if(action==='public.list')url+='?api=public.list&t='+Date.now();
      else {options.headers={'Content-Type':'text/plain;charset=UTF-8'};options.body=JSON.stringify({action,payload});}
      const response=await fetch(url,options);
      if(!response.ok)throw Error('HTTP '+response.status);
      const result=await response.json();
      if(!result||typeof result.ok!=='boolean')throw Error('INVALID_RESPONSE');
      if(!result.ok){const error=Error(result.error||'預約服務暫時無法處理');error.bookingResponse=true;throw error;}
      return result.data;
    }catch(error){
      if(error.bookingResponse)throw error;
      throw Error(action==='public.book'?'尚未取得送出結果，請按「送出預約」重試同一筆資料，系統會避免重複登記。':'暫時無法取得場次，請按「重新載入」再試。');
    }finally{clearTimeout(timer);}
  }
  root.BookingHttp={call};
})(typeof globalThis!=='undefined'?globalThis:this);
</script>

  function pageUrl(page){if(boot.mode==='standalone')return page==='admin'?boot.serviceUrl+'?view=admin':'./';if(!demo&&page==='booking'&&boot.page==='admin'&&boot.publicSiteUrl)return boot.publicSiteUrl;return demo?(page==='admin'?'admin.html':'index.html'):(boot.serviceUrl+(page==='admin'?'?view=admin':''));}

 class="guide-card"><h3>預約後，接下來呢？</h3><div class="steps"><div class="step"><span class="step-num">01</span><div><strong>收到預約確認</strong><p>送出後顯示預約編號，並寄送 Email 確認。</p></div></div><div class="step"><span class="step-num">02</span><div><strong>確認成團結果</strong><p>前一天中午查看網站，或留意成團通知信。</p></div></div><div class="step"><span class="step-num">03</span><div><strong>到櫃檯報到繳費</strong><p>開場前 20 分鐘開始報到，名額保留至前 5 分鐘。</p></div></div></div><div class="guide-contact"><span>行程有變動？請電話取消</span><a href="tel:035892680">03-5892680</a></div></aside></div></section>${rules()}</main>`+footer();

  async function loadPublic(){try{const data=await api('public.list');state.sessions=data.sessions;syncTime(data.now);const months=[...new Set(state.sessions.filter(s=>!s.deletedAt&&s.date>=C.dateKey(now())).map(s=>s.date.slice(0,7)))];$('#month').innerHTML='<option value="all">全部月份</option>'+months.map(m=>`<option value="${m}">${m.slice(0,4)} 年 ${Number(m.slice(5))} 月</option>`).join('');$('#month').value=state.month;renderSessions();}catch(err){$('#session-list').innerHTML=`<div class="error-box" role="alert">${esc(err.message)}<br><button class="btn secondary small" id="reload-public" style="margin-top:12px">重新載入</button></div>`;$('#reload-public').onclick=loadPublic;}}
  function renderSessions(){

    }).join(''):`<div class="empty">${icon('calendar',33)}<h3>${state.sessions.length?'目前沒有符合的場次':'新的體驗場次，準備中'}</h3><p>${state.sessions.length?'可以切換月份或成團狀態，查看其他場次。':'場次開放後會顯示在這裡，歡迎稍後再來看看。'}</p></div>`;

lass="btn full" type="submit">確認預約資料 ${icon('arrow',17)}</button><p class="privacy-note">聯絡資料僅供本次預約、活動通知與聯繫使用。</p></form>`);

  function stepper(id,value,min,max){return `<div class="number-input"><button type="button" data-step="${id}" data-delta="-1" aria-label="減少${id==='people'?'報名':'隨行幼兒'}人數">−</button><input id="${id}" name="${id}" type="number" inputmode="numeric" min="${min}" max="${max}" step="1" value="${value}" required><button type="button" data-step="${id}" data-delta="1" aria-label="增加${id==='people'?'報名':'隨行幼兒'}人數">＋</button></div>`;}

  function adminShell(){return `<div class="admin-layout"><aside class="sidebar"><a href="${esc(pageUrl('admin'))}">${brand()}</a><div><div class="admin-label">農園管理工作台</div><nav class="sidebar-nav" aria-label="管理導覽"><button class="active" id="nav-sessions" aria-label="場次與預約">${icon('calendar')}<span>場次與預約</span></button><a href="${esc(pageUrl('booking'))}" target="_blank" rel="noopener" aria-label="查看預約前台">${icon('external')}<span>查看預約前台</span></a><button id="logout" aria-label="登出">${icon('logout')}<span>登出</span></button></nav></div><div class="sidebar-bottom">懂柿長說柿 · A 方案<br>現場報到付款<br>活動當天由現場人員安排</div></aside><main id="main" class="admin-main"><div id="admin-content"><div class="loading-line">正在取得預約名單</div></div></main></div>`;}

o?'<button id="reset-demo" class="link-button">重設示範資料</button>':''}</div>`;
    $('#create-session').onclick=createDialog;$('#refresh-admin').onclick=loadAdmin;
    $('#admin-month').onchange=renderAdminTable;$('#admin-range').onchange=renderAdminTable;renderAdminTable();
    if(demo)$('#reset-demo').onclick=()=>{dialog('重設示範資料',`<p>清除這個瀏覽器的示範預約與場次，回復最初的示範內容。</p><div class="form-actions"><button class="btn secondary" id="keep-demo">保留</button><button class="btn" id="confirm-reset">重設</button></div>`);$('#keep-demo').onclick=()=>$('#dialog').close();$('#confirm-reset').onclick=async()=>{await api('admin.reset');$('#dialog').close();loadAdmin();};};
  }
  function renderAdminTable(){
    const month=$('#admin-month').value,range=$('#admin-range').value;
    const rows=state.sessions.filter(s=>(month==='all'||s.date.startsWith(month))&&(range==='deleted'?!!s.deletedAt:!s.deletedAt&&(range==='all'||s.date>=C.dateKey(now()))));
    $('#admin-session-table').innerHTML=`<div class="table-scroll"><table><thead><tr><th>日期／時間</th><th>成團狀態</th><th>報名／名額</th><th>隨行幼兒</th><th>成團通知時間</th><th></th></tr></thead><tbody>${rows.length?rows.map(s=>`<tr><td><button class="session-select" data-detail="${s.id}"><div class="table-main">${dateLabel(s.date)} ${s.time}</div><div class="table-sub">${s.date.slice(0,4)} · A 方案／約 30 分鐘</div></button></td><td>${badge(s)}${s.plannedDecision?`<div class="table-sub">已排定：${C.STATUS[s.plannedDecision]}</div>`:''}</td><td><span class="table-main">${s.counts.people}</span> / ${s.capacity} 人<div class="capacity-line"><span style="width:${Math.min(100,s.counts.people/s.capacity*100)}%"></span></div></td><td>${s.counts.children} 人</td><td>${C.taipei(s.noticeAt,true)}<div class="table-sub">${s.registrationText}</div></td><td><button class="table-link" data-detail="${s.id}">管理場次 ${icon('arrow',14)}</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty-cell">尚無場次。按右上角「新增場次」開始安排。</td></tr>'}</tbody></table></div>`;
    document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.detail;renderDetail();});
  }
  function createDialog(){dialog('新增一個場次',`<form id="create-form"><div class="form-row"><div class="field"><label for="session-date">活動日期</label><input id="session-date" name="date" type="date" min="${C.dateKey(+now()+86400000)}" required></div><div class="field"><label for="session-time">開始時間</label><input id="session-time" name="time" type="time" value="10:00" required></div></div><div class="selected-session"><div><b>懂柿長說柿 A 方案</b><p>每人 100 元 · 約 30 分鐘 · 上限 40 人</p></div></div><div class="safe-notice">建立後開放報名，成團狀態為「待確認」。成團由你判斷，20 人僅供參考。系統會在「散客預約」內建立這一場的工作表。</div>${errHTML()}<div class="form-actions"><button class="btn" type="submit">建立並開放報名 ${icon('plus',17)}</button></div></form>`);
    const id=crypto.randomUUID();$('#create-form').onsubmit=async e=>{e.preventDefault();const reset=busy(e.target.querySelector('[type=submit]'),'建立中…');try{const p=Object.fromEntries(new FormData(e.target));C.validateSession(p,now());await api('admin.create',{...p,requestId:id});$('#dialog').close();await loadAdmin();toast(demo?'已新增示範場次':'場次已建立，對應工作表已新增');}catch(err){errorBox(err);reset();}};
  }
  function rescheduleDialog(s){
    const hasBookings=s.counts.orders>0;
    dialog('調整場次時間',`<form id="reschedule-form"><p class="hint" style="margin-bottom:18px">原場次：${s.date} ${s.time}。預約編號、人數與成團狀態會保留。</p><div class="form-row"><div class="field"><label for="change-date">活動日期</label><input id="change-date" name="date" type="date" min="${C.dateKey(now())}" value="${s.date}" required></div><div class="field"><label for="change-time">開始時間</label><input id="change-time" name="time" type="time" value="${s.time}" required></div></div><div id="schedule-preview" class="safe-notice"></div>${hasBookings?`<label class="check-label"><input name="notify" type="checkbox" required><span>本場有 ${s.counts.orders} 筆有效預約。確認調整後，將寄送時間異動通知給這些聯絡人。</span></label>`:'<p class="hint">目前沒有有效預約，儲存後直接更新網站與工作表，不會寄信。</p>'}${errHTML()}<div class="form-actions"><button type="button" class="btn secondary" id="back-reschedule">返回</button><button class="btn" type="submit">${hasBookings?'儲存並寄送異動通知':'儲存新時間'}</button></div></form>`);
    const showTiming=()=>{try{const clean=C.validateReschedule({date:$('#change-date').value,time:$('#change-time').value},now()),t=C.timing(clean);$('#schedule-preview').textContent=`成團通知：${C.taipei(t.notice,true)}；線上報名截止：${C.taipei(t.cutoff-60000,true)}。${C.taipei(t.checkin)} 開始報到繳費，名額保留至 ${C.taipei(t.hold)}。${s.plannedDecision?'原本排定的成團決定會依新日期公布。':''}`;}catch(err){$('#schedule-preview').textContent=err.message;}};
    $('#change-date').onchange=showTiming;$('#change-time').oninput=showTiming;showTiming();$('#back-reschedule').onclick=()=>$('#dialog').close();
    $('#reschedule-form').onsubmit=async e=>{e.preventDefault();const reset=busy(e.target.querySelector('[type=submit]'),'儲存中…');try{const p=Object.fromEntries(new FormData(e.target));C.validateReschedule(p,now());const r=await api('admin.reschedule',{sessionId:s.id,date:p.date,time:p.time,expectedDate:s.date,expectedTime:s.time,notify:p.notify==='on'});$('#dialog').close();await loadAdmin();toast(!r.changed?'時間沒有變更':demo?'示範時間已更新，沒有寄送郵件':`時間已更新${hasBookings?`：通知送出 ${r.delivery.sent} 封，失敗 ${r.delivery.failed} 封`:''}`);}catch(err){errorBox(err);reset();}};
  }
  function deleteDialog(s){
    const blocked=s.counts.orders>0;
    dialog('刪除場次',`<p>${s.date} ${s.time} · 懂柿長說柿</p><div class="safe-notice">${blocked?`本場仍有 ${s.counts.orders} 筆有效預約。請先處理客人的取消，再刪除場次；若活動無法成團，可先用「不成團」通知客人。`:'刪除後不會顯示在預約前台。工作表與原名單會保留，可從「已刪除場次」還原。'}</div>${errHTML()}<div class="form-actions"><button class="btn secondary" id="back-delete">返回</button>${blocked?'':'<button class="btn danger" id="apply-delete">確認刪除</button>'}</div>`);
    $('#back-delete').onclick=()=>$('#dialog').close();if(blocked)return;
    $('#apply-delete').onclick=async e=>{const reset=busy(e.currentTarget,'刪除中…');try{await api('admin.delete',{sessionId:s.id});$('#dialog').close();state.selected=null;await loadAdmin();$('#admin-range').value='deleted';renderAdminTable();toast('已移至已刪除場次，原紀錄保留');}catch(err){errorBox(err);reset();}};
  }
  function restoreDialog(s){
    dialog('還原場次',`<p>${s.date} ${s.time}</p><div class="safe-notice">還原後會保留原成團狀態；尚未截止且未取消的場次將重新開放報名。先前的預定成團通知需重新指定。</div>${errHTML()}<div class="form-actions"><button class="btn secondary" id="back-restore">返回</button><button class="btn" id="apply-restore">確認還原</button></div>`);
    $('#back-restore').onclick=()=>$('#dialog').close();$('#apply-restore').onclick=async e=>{const reset=busy(e.currentTarget,'還原中…');try{await api('admin.restore',{sessionId:s.id});$('#dialog').close();await loadAdmin();toast('場次已還原');}catch(err){errorBox(err);reset();}};
  }
  function renderDetail(){const s=state.sessions.find(x=>x.id===state.selected);if(!s){state.selected=null;renderAdmin();return;}
    const failed=s.bookings.flatMap(b=>b.jobs).filter(j=>j.status==='failed').length,unknown=s.bookings.flatMap(b=>b.jobs).filter(j=>j.status==='unknown').length;
    $('#admin-content').innerHTML=`<div class="admin-top"><button class="link-button" id="back-sessions">${icon('back',15)} 返回場次列表</button><div class="admin-top-actions"><button class="btn secondary small" id="refresh-detail">${icon('refresh',15)}更新</button><button class="btn secondary small" id="export-list">匯出 CSV</button><button class="btn secondary small" id="print-list">${icon('print',15)}列印報到名單</button></div></div><div class="session-tools"><span class="hint">${s.deletedAt?'此場次已移至已刪除，保留原名單與處理紀錄。':'場次日期與時間請在此調整，會同步更新試算表。'}</span><div class="admin-toolbar">${s.deletedAt?'<button class="btn secondary small" id="restore-session">還原場次</button>':`${+now()<s.startAt?'<button class="btn secondary small" id="reschedule-session">調整時間</button>':''}<button class="btn secondary small danger-link" id="delete-session">刪除場次</button>`}</div></div><section class="panel"><div class="detail-heading"><div><div class="eyebrow">懂柿長說柿 · A 方案</div><h2>${s.date.replace(/-/g,'/')} ${s.time}</h2><p>約 30 分鐘 · ${money(s.price)}／人 · 現場報到付款</p></div>${badge(s)}</div><div class="detail-controls">${!s.deletedAt&&now()<s.endAt?`<button class="btn green small" id="confirm-session">${icon('check',15)}確認成團</button><button class="btn secondary small" id="cancel-session">不成團</button>`:''}<span class="hint">${s.plannedDecision?`已排定 ${C.taipei(s.noticeAt,true)} 公布：${C.STATUS[s.plannedDecision]}`:`${C.taipei(s.noticeAt,true)} 公布成團結果`}</span></div><div class="detail-stats"><span><b>${s.counts.people}</b>／40 位報名</span><span><b>${s.counts.children}</b>位隨行幼兒</span><span><b>${s.counts.orders}</b>筆有效預約</span><span><b>${money(s.counts.amount)}</b>預計現場收款</span></div><div style="padding:15px 24px;font-size:calc(12px * var(--text-scale));color:var(--muted)">${C.taipei(s.checkinAt)} 開始報到繳費 · 名額保留至 ${C.taipei(s.holdAt)} · ${s.time} 準時開場，不可中途加入<br>線上報名至 ${C.taipei(s.cutoffAt-60000,true)}；活動當天由現場人員人工處理。</div></section>${!s.deletedAt&&(failed||unknown)?`<div class="admin-callout">${icon('mail',17)}<span>${failed} 封寄送失敗${unknown?`，${unknown} 封結果待確認`:''}。已成功寄出的信件不會重寄。</span><button class="btn secondary small" id="retry-mail">補寄失敗通知</button>${unknown?'<button class="link-button" id="retry-unknown">處理結果待確認</button>':''}</div>`:''}<section class="panel"><div class="panel-header"><h2>預約名單</h2><span class="hint">取消請先電話聯繫，由後台更新</span></div><div class="table-scroll"><table><thead><tr><th>聯絡人／預約編號</th><th>聯絡方式</th><th>報名</th><th>幼兒</th><th>應收金額</th><th>通知／狀態</th><th>操作</th></tr></thead><tbody>${s.bookings.length?s.bookings.map(b=>`<tr class="${b.status==='cancelled'?'cancelled-row':''}"><td><div class="table-main">${esc(b.name)}</div><div class="table-sub">${esc(b.id)}</div>${b.notes?`<div class="table-sub" style="max-width:180px;white-space:normal">${esc(b.notes)}</div>`:''}</td><td>${esc(b.phone)}<div class="table-sub">${esc(b.email)}</div></td><td>${b.people}</td><td>${b.children}</td><td>${money(b.amount)}</td><td>${b.status==='cancelled'?'<span class="badge">已取消</span>':mailLabel(b)}<div class="table-sub">${C.taipei(b.createdAt,true)}</div></td><td>${!s.deletedAt&&b.status==='active'?`<div class="table-actions"><button class="table-link" data-edit="${b.id}">修改</button><button class="table-link" data-cancel="${b.id}">取消</button></div>`:'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty-cell">尚無預約，客人報名後會顯示在這裡。</td></tr>'}</tbody></table></div></section>`;
    if($('#reschedule-session'))$('#reschedule-session').onclick=()=>rescheduleDialog(s);
    if($('#delete-session'))$('#delete-session').onclick=()=>deleteDialog(s);
    if($('#restore-session'))$('#restore-session').onclick=()=>restoreDialog(s);
    $('#back-sessions').onclick=()=>{state.selected=null;renderAdmin();};$('#refresh-detail').onclick=loadAdmin;
    if($('#confirm-session'))$('#confirm-session').onclick=()=>decisionDialog(s,'confirmed');if($('#cancel-session'))$('#cancel-session').onclick=()=>decisionDialog(s,'cancelled');
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editBooking(s,b.dataset.edit,false));document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>editBooking(s,b.dataset.cancel,true));
    $('#print-list').onclick=()=>freshExport(s.id,true);$('#export-list').onclick=()=>freshExport(s.id,false);
    if($('#retry-mail'))$('#retry-mail').onclick=()=>retryMail(s,false);if($('#retry-unknown'))$('#retry-unknown').onclick=()=>retryMail(s,true);
  }
  function mailLabel(b){const j=b.jobs.filter(j=>j.status!=='superseded').at(-1);if(!j)return '待寄送';const labels={sent:'已送出',failed:'寄送失敗',sending:'寄送中',pending:'待寄送',unknown:'結果待確認',demo:'示範：未寄送'};return `<span class="${['failed','unknown'].includes(j.status)?'notice-warning':''}">${labels[j.status]||'待寄送'}</span>`;}
  function decisionDialog(s,decision){const early=+now()<s.noticeAt,word=decision==='confirmed'?'成團':'不成團';dialog(`確認本場${word}`,`<div class="selected-session"><div><b>${dateLabel(s.date)} ${s.time}</b><p>目前 ${s.counts.people} 位報名，另有 ${s.counts.children} 位隨行幼兒。</p></div></div><p style="font-size:calc(13px * var(--text-scale))">${decision==='confirmed'?'公布成團後，有剩餘名額仍可報名至前一天 23:59。':'公布不成團後，前台將停止接受本場報名。'}通知會分別寄給有效預約的聯絡人。</p>${early?'<label class="check-label"><input id="schedule-notice" type="checkbox" checked><span>先儲存此決定，於前一天中午公布並寄送通知。</span></label>':'<div class="safe-notice">已到成團通知時間，確認後會立即更新網站並寄送通知。</div>'}${errHTML()}<div class="form-actions"><button class="btn secondary" id="back-decision">返回</button><button class="btn ${decision==='confirmed'?'green':'danger'}" id="apply-decision">確認${word}</button></div>`);$('#back-decision').onclick=()=>$('#dialog').close();$('#apply-decision').onclick=async e=>{const reset=busy(e.currentTarget,'處理中…');try{const r=await api('admin.decide',{sessionId:s.id,decision,schedule:!!$('#schedule-notice')?.checked});$('#dialog').close();await loadAdmin();if(r.scheduled)toast('已儲存決定，排定前一天中午公布');else toast(demo?'示範狀態已更新，沒有寄出郵件':`已公布${word}：通知送出 ${r.delivery.sent} 封，失敗 ${r.delivery.failed} 封${r.delivery.pending?'，其餘待寄送':''}`);}catch(err){errorBox(err);reset();}};}
  function editBooking(s,id,cancel){const b=s.bookings.find(b=>b.id===id);dialog(cancel?'取消這筆預約':'修改預約人數',`<p style="margin-bottom:20px">${esc(b.name)} · ${esc(b.phone)}<br><span class="hint">${esc(b.id)}</span></p>${cancel?`<div class="safe-notice">確認電話取消後，將釋放 ${b.people} 個名額。紀錄會保留，原資料不會刪除。</div>`:`<form id="edit-form"><div class="form-row"><div class="field"><label for="people">報名人數</label>${stepper('people',b.people,1,15)}</div><div class="field"><label for="children">隨行幼兒人數</label>${stepper('children',b.children,0,999)}</div></div></form>`}${errHTML()}<div class="form-actions"><button class="btn secondary" id="back-edit">返回</button><button class="btn ${cancel?'danger':''}" id="save-booking">${cancel?'確認取消':'儲存修改'}</button></div>`);if(!cancel)bindSteppers();$('#back-edit').onclick=()=>$('#dialog').close();$('#save-booking').onclick=async e=>{if(!cancel&&!$('#edit-form').reportValidity())return;const reset=busy(e.currentTarget,'儲存中…');try{await api('admin.booking',{sessionId:s.id,id,cancel,people:$('#people')?.value,children:$('#children')?.value});$('#dialog').close();await loadAdmin();toast(cancel?'預約已取消，名額已釋放':'人數已更新');}catch(err){errorBox(err);reset();}};}
  async function retryMail(s,includeUnknown){if(includeUnknown){dialog('確認補寄結果不明的通知',`<p style="font-size:calc(13px * var(--text-scale))">這些信件曾在寄送時中斷，可能已送達。請先確認收件情況，補寄可能讓客人再次收到通知。</p>${errHTML()}<div class="form-actions"><button class="btn secondary" id="no-retry">返回</button><button class="btn" id="yes-retry">已確認，需要補寄</button></div>`);$('#no-retry').onclick=()=>$('#dialog').close();$('#yes-retry').onclick=async e=>{const reset=busy(e.currentTarget,'補寄中…');try{const r=await api('admin.retry',{sessionId:s.id,includeUnknown:true});$('#dialog').close();await loadAdmin();toast(`補寄完成：送出 ${r.sent} 封，失敗 ${r.failed} 封`);}catch(err){errorBox(err);reset();}};return;}
    const button=$('#retry-mail'),reset=busy(button,'補寄中…');try{const r=await api('admin.retry',{sessionId:s.id});await loadAdmin();toast(`補寄完成：送出 ${r.sent} 封，失敗 ${r.failed} 封`);}catch(err){toast(err.message);reset();}}
  async function freshExport(id,print){const button=$(print?'#print-list':'#export-list'),reset=busy(button,'取得最新名單…');try{const data=await api('admin.list');state.sessions=data.sessions;syncTime(data.now);const fresh=data.sessions.find(s=>s.id===id);if(!fresh)throw Error('找不到場次');if(print)printList(fresh);else exportCSV(fresh);}catch(err){toast(err.message);}finally{reset();}}
  function printList(s){const list=s.bookings.filter(b=>b.status==='active');$('#print-area').innerHTML=`<h1>懂柿長說柿｜${s.date} ${s.time} 報到名單 ${demo?'（示範）':''}</h1><p>${C.STATUS[s.status]} · 報名 ${s.counts.people} 人／隨行幼兒 ${s.counts.children} 人 · ${C.taipei(s.checkinAt)} 開始報到，名額保留至 ${C.taipei(s.holdAt)} · 列印時間 ${C.taipei(now(),true)}<br>${+now()<s.cutoffAt?'線上報名尚未截止，此名單可能繼續增加。活動當天請重新取得最終名單。':'線上報名已截止。當天現場報名與收費由工作人員人工確認。'}</p><table><thead><tr><th>序</th><th>聯絡人</th><th>手機</th><th>報名</th><th>幼兒</th><th>應收金額</th><th>報到／收費</th><th>備註</th></tr></thead><tbody>${list.map((b,i)=>`<tr><td>${i+1}</td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${b.people}</td><td>${b.children}</td><td>${money(b.amount)}</td><td>□ 報到　□ 已收</td><td>${esc(b.notes)}</td></tr>`).join('')}</tbody></table>`;window.print();}
  function exportCSV(s){const rows=[['預約編號','姓名','手機','Email','報名人數','隨行幼兒人數','應收金額','預約狀態','備註'],...s.bookings.map(b=>[b.id,b.name,b.phone,b.email,b.people,b.children,b.amount,b.status==='active'?'有效':'已取消',b.notes])];const cell=v=>{let t=String(v);if(/^[=+@\-\t\r\n]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};const blob=new Blob(['\ufeff'+rows.map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${s.date}_${s.time.replace(':','')}_預約名單.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
  if(demo){$('#preview-notice').hidden=false;$('#preview-notice').innerHTML=`<span>操作預覽｜示範資料不會成立正式預約或寄出郵件</span><a href="${pageUrl(boot.page==='admin'?'booking':'admin')}">${boot.page==='admin'?'查看預約前台':'試用管理後台'} ${icon('arrow',12)}</a>`;}
  if(boot.page==='admin')adminPage();else publicPage();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#dialog').open){if(boot.page==='admin'&&state.token)loadAdmin();else if(boot.page!=='admin')loadPublic();}});
  setInterval(()=>{if(document.visibilityState==='visible'&&!$('#dialog').open){if(boot.page==='admin'&&state.token)loadAdmin();else if(boot.page!=='admin')loadPublic();}},60000);
})();
</script>
</body>
